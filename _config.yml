title: UMN RKT Avionics Documentation
description: Documentation for the UMN RKT Avionics project
theme: just-the-docs

url: https://UMN-Rocket-Team.github.io/avionics-docs
# baseurl: /avionics-docs

# Navigation

aux_links:
  Template Repository: https://github.com/UMN-Rocket-Team/avionics-docs

aux_links_new_tab: true

favicon_ico: "/assets/images/favicon.ico"

# Search

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation / usability
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Edit this page on GitHub
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/UMN-Rocket-Team/avionics-docs"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Last modified timestamp
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Callout boxes (these are nice please use them)
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

# Diagrams (```mermaid code blocks)
mermaid:
  version: "11.4.1"

# Footer
footer_content: "Maintained by the UMN Rocket Team Avionics subteam. Found an error or an outdated page? Open a pull request or ping a subteam lead."

# Plugins
plugins:
  - jekyll-last-modified-at
  - jekyll-seo-tag
  - jekyll-sitemap

## There're 87 repetitive deprecation warnings in the build log. This is a temporary fix to silence them until the issue is resolved.
sass:
  quiet_deps: true
